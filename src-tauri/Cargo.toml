[package]
name = "claude-pulse"
version = "0.4.1"
description = "Claude Code usage monitor widget"
authors = ["산해"]
edition = "2021"

[lib]
name = "claude_pulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-autostart = "2.0"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "5"
aes-gcm = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
lofty = "0.21"
walkdir = "2"

[target."cfg(target_os = \"windows\")".dependencies]
window-vibrancy = "0.7"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }

[target."cfg(target_os = \"macos\")".dependencies]
window-vibrancy = "0.7"
# Keychain access for "Claude Safe Storage" password (Chromium pattern).
security-framework = "2"
# PBKDF2-HMAC-SHA1 (1003 iterations, salt="saltysalt") → 16-byte AES-128 key,
# same recipe Chromium uses on macOS to derive the OSCrypt master key.
pbkdf2 = "0.12"
sha1 = "0.10"
hmac = "0.12"
# AES-128-CBC for OSCrypt payloads on macOS (Windows uses GCM, so the
# existing aes-gcm dep stays on its own target).
cbc = { version = "0.1", features = ["block-padding"] }
aes = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
